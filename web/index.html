<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090511">
  <title>ASTROCARE — Your Health. Our Mission. Beyond Earth.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Inline enhancement utilities */
    .pulse-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #20d9a0; box-shadow: 0 0 10px #20d9a0; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } 100% { opacity: 0.4; transform: scale(0.9); } }
    .demo-credential-pill { font-size: 11px; padding: 6px 12px; border-radius: 8px; background: #221430; border: 1px solid #4f3366; color: #d4a7ff; cursor: pointer; text-align: left; transition: all 0.2s; }
    .demo-credential-pill:hover { background: #321c47; border-color: #8b52ca; }
    .interactive-chart-svg { width: 100%; height: 100%; overflow: visible; }
    .chart-tooltip { pointer-events: none; transition: opacity 0.15s ease; }
    .twin-node { cursor: pointer; transition: transform 0.2s; }
    .twin-node:hover { transform: scale(1.1); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
